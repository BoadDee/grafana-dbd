name: Deploy Grafana Dashboards

on:
  push:
    branches:
      - main
  
    paths:
      - 'grafana-dashboards/*.json'  # Trigger only when dashboard JSON files change

  workflow_dispatch:  # Allows manual execution

permissions:
  contents: read
  pull-requests: write
  id-token: write
  checks: write
  issues: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq (for JSON processing)
        run: sudo apt-get install jq -y

      - name: azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Azure AD Token
        run: |
          ACCESS_TOKEN=$(curl -s -X POST \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" | jq -r .access_token)
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Get Folder ID
        run: |
          FOLDER_NAME="dre"  # Change this to your folder name
          FOLDER_ID=$(curl -s -X GET "${{ secrets.GRAFANA_URL }}/api/folders" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" | jq -r --arg name "$FOLDER_NAME" '.[] | select(.title==$name) | .id')

          if [ -z "$FOLDER_ID" ]; then
            echo "Folder '$FOLDER_NAME' not found. Exiting..."
            exit 1
          fi

          echo "FOLDER_ID=$FOLDER_ID" >> $GITHUB_ENV

      - name: Deploy Dashboards to Folder
        run: |
          for file in dashboards/**/*.json; do
            DASHBOARD_UID=$(basename "$file" .json)
            echo "Deploying dashboard: $DASHBOARD_UID to folder ID: $FOLDER_ID"

            curl -s -X POST "${{ secrets.GRAFANA_URL }}/api/dashboards/db" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d @<(jq --arg uid "$DASHBOARD_UID" --argjson folderId "$FOLDER_ID" \
                '. + {overwrite: true, dashboard: {uid: $uid, folderId: $folderId}}' "$file") \
              | jq
          done
