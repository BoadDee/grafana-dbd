name: Deploy Grafana Dashboards

on:
  push:
    branches:
      - main
  
    paths:
      - 'grafana-dashboards/*.json'  # Trigger only when dashboard JSON files change

  workflow_dispatch:  # Allows manual execution

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq (for JSON processing)
        run: sudo apt-get install jq -y

      - name: Get Azure AD Token
        run: |
          ACCESS_TOKEN=$(curl -s -X POST \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials" \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" | jq -r .access_token)
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Deploy Dashboards
        run: |
          for file in grafana-dashboards/*.json; do
            DASHBOARD_UID=$(basename "$file" .json)  # Use filename as dashboard UID
            echo "Deploying dashboard: $DASHBOARD_UID"

            curl -s -X POST "${{ secrets.GRAFANA_URL }}/dashboards/dre" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d @<(jq --arg uid "$DASHBOARD_UID" '. + {overwrite: true, dashboard: {uid: $uid}}' "$file") \
              | jq
          done
